spring.application.name=medical-platform

# --- Database (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medical_platform}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# Use Flyway/Liquibase migrations for production; "update" is for early development only.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- API documentation and monitoring ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- JWT ---
# HS256 needs a secret of at least 32 bytes. ALWAYS override APP_JWT_SECRET outside local dev.
app.security.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.security.jwt.issuer=medical-platform
app.security.jwt.expiration=PT1H

# --- Login protection ---
app.security.max-failed-attempts=5
app.security.lock-duration=PT15M

# --- Bootstrap administrator (created only when no admin exists) ---
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@medical-platform.local}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:ChangeMe!12345}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB

app.clinic.zone=Africa/Tunis
app.storage.root=./storage

app.jobs.reminders-cron=0 0 * * * *
app.jobs.daily-summary-cron=0 0 7 * * *
app.jobs.integrity-cron=0 30 2 * * *
app.jobs.analysis-poll-ms=10000